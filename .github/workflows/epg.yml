name: Update EPG

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_releases:
        description: 'Delete all Releases and their tags, then rebuild date versions'
        type: boolean
        required: false
        default: false
  schedule:
    # Beijing 00:00/04:00/08:00/12:00/16:00/20:00; GitHub may delay runs.
    - cron: '0 */4 * * *'

permissions:
  contents: read

jobs:
  core:
    name: Priority Yangshipin and CCTV publication
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      generation_result: ${{ steps.generate.outcome }}
      publication_result: ${{ steps.release.outcome }}
    concurrency:
      group: epg-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate the independent core publication path
        run: node --test test/source.test.js test/cctv.test.js test/epg.test.js test/channels.test.js test/fallback.test.js test/releases.test.js
      - name: Refresh priority sources with verified same-date fallbacks
        id: generate
        timeout-minutes: 9
        run: npm run generate -- --core-only --past-days 0 --future-days 2
      - name: Publish today's usable EPG before provincial collection
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/publish.js dist | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save independent core publication report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epg-core-run-report
          path: dist/run-report.json
          if-no-files-found: warn
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm test

  publish:
    needs: [test, core]
    if: always() && needs.test.result == 'success' && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.EPG_PUBLISH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      generation_result: ${{ steps.generate.outcome }}
      publication_result: ${{ steps.release.outcome }}
    permissions:
      contents: write
    concurrency:
      group: epg-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --omit=dev
      - name: Install headless Chromium for official broadcaster pages
        continue-on-error: true
        run: npx playwright install --with-deps --only-shell chromium
      - name: Fetch and validate Yangshipin, CCTV and provincial schedules
        id: generate
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if npm run generate; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Schedule generation failed after 3 attempts; publication stopped."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::Schedule generation attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done
      - name: Refresh daily releases and promote today to Latest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_RELEASES: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_releases }}
        run: |
          node src/publish.js dist | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save run report for post-publication notification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epg-run-report
          path: dist/run-report.json
          if-no-files-found: ignore
          retention-days: 7

  notify:
    name: Publication report and source warnings
    needs: [test, core, publish]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Read completed publication report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: epg-run-report
          path: dist
      - name: Read independent core publication report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: epg-core-run-report
          path: dist/core
      - name: Write detailed report and check publication status
        env:
          EPG_TEST_RESULT: ${{ needs.test.result }}
          EPG_PUBLISH_JOB_RESULT: ${{ needs.publish.result }}
          EPG_GENERATION_RESULT: ${{ needs.publish.outputs.generation_result }}
          EPG_PUBLICATION_RESULT: ${{ needs.publish.outputs.publication_result }}
          EPG_STRICT_SOURCE_ALERTS: ${{ vars.EPG_STRICT_SOURCE_ALERTS }}
          EPG_CORE_JOB_RESULT: ${{ needs.core.result }}
          EPG_CORE_GENERATION_RESULT: ${{ needs.core.outputs.generation_result }}
          EPG_CORE_PUBLICATION_RESULT: ${{ needs.core.outputs.publication_result }}
        run: node src/notify.js dist dist/core
      - name: Save readable diagnostics (HTML, text and JSON)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epg-diagnostics
          path: dist/diagnostics
          if-no-files-found: warn
          retention-days: 14
