name: Update EPG

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_releases:
        description: 'Delete all Releases and their tags, then rebuild date versions'
        type: boolean
        required: false
        default: false
  schedule:
    # UTC 16:00 -> next day 00:00 in Beijing. GitHub may delay scheduled runs.
    - cron: '0 16 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm test

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: epg-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --omit=dev
      - name: Fetch and validate schedules
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if npm run generate; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Schedule generation failed after 3 attempts; publication stopped."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::Schedule generation attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done
      - name: Refresh daily releases and promote today to Latest
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_RELEASES: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_releases }}
        run: |
          node src/publish.js dist | tee -a "$GITHUB_STEP_SUMMARY"
